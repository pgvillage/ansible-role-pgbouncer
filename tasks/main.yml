---

- name: Assertions
  ansible.builtin.assert:
    that:
      - "pgbouncer_instances | length > 0"
      - "pgbouncer_instances.keys() | reject('match', '^[A-Za-z0-9_-]+$') | list | length == 0"
      - "_pgbouncer_ports | unique | length == _pgbouncer_ports | length"
    fail_msg: >-
      pgbouncer_instances must be non-empty, instance names may only contain [A-Za-z0-9_-]
      and every instance needs a unique port (got {{ _pgbouncer_ports }})
  vars:
    _pgbouncer_ports: "{{ pgbouncer_instances.values() | map(attribute='port', default=pgbouncer_instance_defaults.port) | list }}"

- name: Install
  ansible.builtin.include_tasks: install.yml

- name: Configure (per instance)
  ansible.builtin.include_tasks: configure.yml
  loop: "{{ pgbouncer_instances | dict2items }}"
  loop_control:
    loop_var: pgbouncer_instance_item
    label: "{{ pgbouncer_instance_item.key }}"
  vars:
    pgbouncer_instance_name: "{{ pgbouncer_instance_item.key }}"
    pgbouncer_instance: "{{ pgbouncer_instance_defaults | combine(pgbouncer_instance_item.value | default({}, true), recursive=True) }}"

- name: Create service file
  ansible.builtin.template:
    dest: /etc/systemd/system/pgbouncer@.service
    src: pgbouncer@.service.j2
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart pgbouncer instances

- name: Gather service facts
  ansible.builtin.service_facts:
  when: pgbouncer_disable_default_service

- name: Disable default (single instance) pgbouncer service
  ansible.builtin.systemd_service:
    name: pgbouncer
    enabled: false
    state: stopped
  when:
    - pgbouncer_disable_default_service
    - "'pgbouncer.service' in ansible_facts.services"

- name: Start pgbouncer instances
  ansible.builtin.systemd_service:
    name: "pgbouncer@{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ pgbouncer_instances.keys() | list }}"

# The package is usually upgraded outside this role (e.g. by the linux role or
# unattended-upgrades), and needrestart skips pgbouncer@*. An instance still
# runs the old binary when the binary was replaced (its ctime) after the
# instance started: restart it then. Both are in whole seconds, and the start
# time is read in UTC, so `date` can parse it. (Reading /proc/<pid>/exe would
# need CAP_SYS_PTRACE, which containers lack. The monotonic start time can't be
# combined with /proc/uptime: uptime includes time suspended, the monotonic
# clock doesn't.)
- name: Find pgbouncer instances that started before their binary was replaced
  ansible.builtin.shell: |
    set -e
    unit='pgbouncer@{{ item }}'
    if [ "$(systemctl show --property MainPID --value "$unit")" -gt 0 ]; then
      started=$(TZ=UTC systemctl show --property ExecMainStartTimestamp --value "$unit")
      if [ -n "$started" ] && [ "$started" != n/a ]; then
        replaced_at=$(stat -c %Z '{{ pgbouncer_install_dir }}/pgbouncer')
        if [ "$replaced_at" -gt "$(TZ=UTC date -d "$started" +%s)" ]; then echo replaced; fi
      fi
    fi
  loop: "{{ pgbouncer_instances.keys() | list }}"
  register: pgbouncer_binary_check
  check_mode: false
  changed_when: pgbouncer_binary_check.stdout | default('') == 'replaced'
  notify:
    - Restart pgbouncer instances
