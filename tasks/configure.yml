---

vars:
  instance_name: "{{ instance.name }}"
  instance_values: "{{ pgbouncer_instance_defaults | combine(instance.value, recursive=True) }}"

- name: Create configfile
  ansible.builtin.template:
    dest: "/etc/pgbouncer/pgbouncer-{{ instance.name }}.ini"
    src: pgbouncer.ini.j2
    owner: "{{ pgbouncer_os_user }}"
    group: "{{ pgbouncer_os_group }}"
    mode: "0666"

- name: Copy script create_function_lookup.sql
  ansible.builtin.template:
    src: create_function_lookup.sql.j2
    dest: /tmp/create_function_lookup.sql
    owner: postgres
    group: postgres
    mode: '0644'

- name: Create DB objects
  become: true
  become_user: postgres
  environment:
    PGSERVICE: master
  run_once: true
  block:
    - name: Create auth DB
      community.postgresql.postgresql_db:
        name: "{{ instance_values.auth_db }}"

    - name: Create auth user
      community.postgresql.postgresql_user:
        name: "{{ instance_values.auth_user }}"
        role_attr_flags: LOGIN

    - name: Run script
      community.postgresql.postgresql_script:
        login_db: "{{ instance_values.auth_db }}"
        path: /tmp/create_function_lookup.sql

- name: Manage HBA
  when: pgbouncer_manage_hba

  block:
    - name: Update pg_hba.conf add pgbouncer
      community.postgresql.postgresql_pg_hba:
        dest: "{{ instance_values.pgdata }}/pg_hba.conf"
        contype: local
        databases: "{{ instance_values.auth_db }}"
        users: "{{ instance_values.auth_user }}"
        method: peer
        options: map=pgbouncer
      notify:
        - Reload postgres
    - name: Update pg_hba.conf to scram-sha-256
      community.postgresql.postgresql_pg_hba:
        dest: "{{ instance_values.pgdata }}/pg_hba.conf"
        contype: local
        databases: all
        users: all
        method: scram-sha-256
      notify:
        - Reload postgres

- name: "Add ident line for pgbouncer to login without password as {{ instance_values.auth_user }}"
  ansible.builtin.lineinfile:
    path: "{{ instance_values.pgdata }}/pg_ident.conf"
    line: "pgbouncer {{ instance_values.os_user }} {{ instance.auth_user }}"
    owner: postgres
    group: postgres
    mode: '0644'
  when: instance_values.manage_ident
  notify: Reload postgres
