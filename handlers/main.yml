---

- name: Reload pgbouncer instances
  ansible.builtin.systemd_service:
    name: "pgbouncer@{{ item.name }}"
    state: reloaded
    enabled: true
    daemon_reload: true
  loop: "{{ pgbouncer_instances | dict2items }}"

- name: Reload postgres
  ansible.builtin.command: pkill -HUP postgres
  register: handle_reload
  changed_when: handle_reload.rc != 0

- name: Restart pgbouncer instances
  ansible.builtin.systemd_service:
    name: "pgbouncer@{{ item.name }}"
    enabled: true
    state: restarted
    daemon_reload: true
  loop: "{{ pgbouncer_instances | dict2items }}"
