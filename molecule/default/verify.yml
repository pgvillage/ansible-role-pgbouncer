---
- name: Verify
  hosts: all
  tasks:
    - name: Read the service states
      ansible.builtin.service_facts:

    - name: Check that the instance runs, and the default pgbouncer service does not
      ansible.builtin.assert:
        that:
          - ansible_facts.services['pgbouncer@main.service'].state == 'running'
          - ansible_facts.services['pgbouncer.service'].state != 'running'

    # service_facts does not report the enabled state of template instances
    - name: Check that the instance is enabled
      ansible.builtin.systemd:
        name: pgbouncer@main.service
        enabled: true
      check_mode: true
      register: enabled
      failed_when: enabled is changed

    # PgBouncer looks up the password of app with public.lookup(), as
    # pgbouncer_auth_user (peer auth with the pgbouncer ident map), and then
    # connects to PostgreSQL as app (over the unix socket: no server port)
    - name: Log in as app through PgBouncer, with scram-sha-256
      ansible.builtin.command: >-
        psql "host=127.0.0.1 port=6432 dbname=postgres user=app"
        -AtF ' ' -c "select current_user, inet_server_port() is null"
      environment:
        PGPASSWORD: app-secret
      register: login
      changed_when: false
      failed_when: login.rc != 0 or login.stdout != 'app t'

    - name: Check that a wrong password is refused
      ansible.builtin.command: psql "host=127.0.0.1 port=6432 dbname=postgres user=app" -c "select 1"
      environment:
        PGPASSWORD: wrong
      register: wrong_login
      changed_when: false
      failed_when: wrong_login.rc == 0 or 'authentication failed' not in wrong_login.stderr

    - name: Show the pools on the admin console, as postgres
      become: true
      become_user: postgres
      ansible.builtin.command: psql "host=/tmp port=6432 dbname=pgbouncer" -Atc "show pools"
      environment:
        PGPASSWORD: postgres-secret
      register: pools
      changed_when: false

    - name: Check that PgBouncer pools postgres for app
      ansible.builtin.assert:
        that: pools.stdout_lines | select('match', '^postgres\|app\|') | list | length == 1
        fail_msg: "{{ pools.stdout }}"

    - name: Read pg_hba.conf and pg_ident.conf
      ansible.builtin.slurp:
        src: "/var/lib/pgsql/data/{{ item }}"
      loop: [pg_hba.conf, pg_ident.conf]
      register: pg_conf

    - name: Check the hba and ident entries for the auth user
      ansible.builtin.assert:
        that:
          - hba is search('local\s+pgbouncer_auth_db\s+pgbouncer_auth_user\s+peer\s+map=pgbouncer')
          - hba is search('local\s+all\s+all\s+scram-sha-256')
          - "'pgbouncer pgbouncer pgbouncer_auth_user' in ident"
      vars:
        hba: "{{ pg_conf.results[0].content | b64decode }}"
        ident: "{{ pg_conf.results[1].content | b64decode }}"

# Simulate a package upgrade outside the role: replace the binary, so the
# running instance shows its executable as deleted. Running the role again
# must then restart the instance (rolling over both hosts), and only then.
- name: Verify the restart after an upgraded binary
  hosts: all
  vars:
    pgbouncer_instances:
      main:
        pgdata: /var/lib/pgsql/data
        pgport: 5432
        port: 6432
  tasks:
    - name: Read the main PID before the upgrade
      ansible.builtin.systemd_service:
        name: pgbouncer@main
      register: before

    - name: Replace the pgbouncer binary, as a package upgrade does
      ansible.builtin.shell: cp -p /usr/bin/pgbouncer /usr/bin/pgbouncer.new && mv /usr/bin/pgbouncer.new /usr/bin/pgbouncer
      changed_when: true

    - name: Run the role again
      ansible.builtin.include_role:
        name: pgvillage.pgbouncer

    - name: Run the handlers
      ansible.builtin.meta: flush_handlers

    - name: Read the main PID after the restart
      ansible.builtin.systemd_service:
        name: pgbouncer@main
      register: after

    - name: Read the executable of the restarted instance
      ansible.builtin.command: readlink /proc/{{ after.status.MainPID }}/exe
      register: after_exe
      changed_when: false

    - name: Check that the instance was restarted, on the new binary
      ansible.builtin.assert:
        that:
          - after.status.MainPID != before.status.MainPID
          - after_exe.stdout == '/usr/bin/pgbouncer'
        fail_msg: "PID before: {{ before.status.MainPID }}, after: {{ after.status.MainPID }} ({{ after_exe.stdout }})"

    - name: Log in as app through the restarted PgBouncer
      ansible.builtin.command: psql "host=127.0.0.1 port=6432 dbname=postgres user=app" -Atc "select 1"
      environment:
        PGPASSWORD: app-secret
      changed_when: false
